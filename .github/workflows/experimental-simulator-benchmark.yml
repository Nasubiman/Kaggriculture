name: Experimental simulator benchmark

on:
  push:
    branches:
      - experimental/faster-simulator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pybind11
      - name: Build optional native accelerator
        run: python scripts/build_native_speedups.py
      - name: Apply guarded main.py speed patch
        run: python scripts/apply_main_speed_patch.py
      - name: Verify main.py parity and benchmark
        run: python scripts/benchmark_main_speed.py --seeds 1 --repeats 2
      - name: Verify native agent parity and benchmark
        run: python scripts/benchmark_native_agent_runtime.py
      - name: Profile native-enabled agent runtime
        run: python scripts/profile_native_agent_runtime.py
      - name: Run simulator parity and benchmark
        run: python scripts/benchmark_experimental_simulation.py --seeds 1 --repeats 2
      - name: Profile simulator paths
        run: python scripts/profile_experimental_simulation.py
      - name: Print benchmark results
        if: always()
        run: |
          for f in reports/main_speed_benchmark.json reports/native_agent_runtime_benchmark.json reports/experimental_simulation_benchmark.json; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              cat "$f"
            fi
          done
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-speed-benchmarks
          path: |
            reports/main_speed_benchmark.json
            reports/native_agent_runtime_benchmark.json
            reports/experimental_simulation_benchmark.json
          if-no-files-found: ignore
