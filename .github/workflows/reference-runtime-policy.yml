name: Reference runtime policy parity

on:
  push:
    branches:
      - agent/reference-runtime-policy-20260915
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pybind11
      - name: Normalize native simulator source
        run: python scripts/prepare_native_simulator_source.py
      - name: Build native accelerators
        run: python scripts/build_native_speedups_turbo.py
      - name: Apply guarded main.py speed patch
        run: python scripts/apply_main_speed_patch.py
      - name: Verify reference runtime policy
        run: python scripts/verify_reference_runtime_policy.py
