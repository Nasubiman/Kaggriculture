name: Partial native v37 parity

on:
  push:
    branches:
      - agent/simulator-v4-v37-native-20260915
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pybind11
      - name: Normalize native simulator source
        run: python scripts/prepare_native_simulator_source.py
      - name: Build native accelerators
        run: python scripts/build_native_speedups_turbo.py
      - name: Apply guarded main.py speed patch
        run: python scripts/apply_main_speed_patch.py
      - name: Verify partial native v37
        run: python scripts/benchmark_native_v37_partial.py
      - name: Print result
        if: always()
        run: cat reports/native_v37_partial.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-v37-partial
          path: reports/native_v37_partial.json
          if-no-files-found: ignore
